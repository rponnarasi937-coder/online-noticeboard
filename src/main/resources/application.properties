# ====================================================================
# KEC Online Notice Board - Spring Boot Configuration
# ====================================================================

spring.application.name=kec-noticeboard
server.port=8080

# --------------------------------------------------------------------
# MySQL Database Configuration
# NOTE: Update username and password to match your local MySQL setup
# If you don't have a password on root (e.g. XAMPP default), leave empty.
# --------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/kec_noticeboard?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --------------------------------------------------------------------
# File Upload Configuration
# --------------------------------------------------------------------
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads/

# --------------------------------------------------------------------
# JWT Security Configuration
# --------------------------------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Serve static frontend files
spring.web.resources.static-locations=classpath:/static/,file:uploads/
